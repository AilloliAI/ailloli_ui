[advisories]
ignore = [
  "RUSTSEC-2024-0436",
  "RUSTSEC-2026-0186",
  "RUSTSEC-2026-0192",
  "RUSTSEC-2026-0206",
]
informational_warnings = ["unmaintained", "unsound"]
severity_threshold = "low"

[output]
deny = ["warnings"]
format = "terminal"
quiet = false
show_tree = true

[yanked]
enabled = true
update_index = true
