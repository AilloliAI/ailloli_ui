version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:17"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    ignore:
      # Deliberate renderer compatibility line; review upgrades manually.
      - dependency-name: wgpu
      # Deliberate native-host baseline; review upgrades manually.
      - dependency-name: winit

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:47"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
