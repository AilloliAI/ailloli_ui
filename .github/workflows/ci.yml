name: Public CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: CI / classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      private_context: ${{ steps.scope.outputs.private_context }}
      docs_brand: ${{ steps.scope.outputs.docs_brand }}
      workflow_policy: ${{ steps.scope.outputs.workflow_policy }}
      package: ${{ steps.scope.outputs.package }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      rust: ${{ steps.scope.outputs.rust }}
      unknown_full: ${{ steps.scope.outputs.unknown_full }}
      full: ${{ steps.scope.outputs.full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      changed_count: ${{ steps.scope.outputs.changed_count }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the Git change range
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BEFORE_SHA: ${{ github.event.before }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CI_HEAD_SHA: ${{ github.sha }}
          CI_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          CI_REF_TYPE: ${{ github.ref_type }}
        run: .github/scripts/classify-ci-changes.sh --public-prefix ""

  repository-audit:
    name: CI / repository policy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Run fail-closed audit fixtures
        run: cargo +1.88.0 xtask audit --self-test
      - name: Audit repository candidate
        run: cargo +1.88.0 xtask audit
      - name: Audit new commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            revision_range="${BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" && \
                  -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "${zero_sha}" ]]; then
            revision_range="${BEFORE_SHA}..${HEAD_SHA}"
          elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
            revision_range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            subject="$(git log -1 --format=%s "${HEAD_SHA}")"
            cargo +1.88.0 xtask audit \
              --commit-subjects-only --commit-subject="${subject}"
            exit 0
          fi
          cargo +1.88.0 xtask audit \
            --commit-subjects-only --commit-range "${revision_range}"
      - name: Validate workflows with pinned actionlint
        run: .github/scripts/run-actionlint.sh .github/workflows/*.yml

  docs-only:
    name: CI / docs-only
    needs: [changes, repository-audit]
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm documentation and brand validation
        run: echo "Documentation and brand changes require no Rust compilation gate."

  package-check:
    name: CI / packaged content
    needs: [changes, repository-audit]
    if: needs.changes.outputs.package == 'true' && needs.changes.outputs.full != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Inspect publishable crate archives
        run: cargo +1.88.0 xtask package-check

  validation:
    name: CI / full validation
    needs: [changes, repository-audit]
    if: needs.changes.outputs.full == 'true'
    uses: ./.github/workflows/validation.yml
    with:
      working-directory: "."
      run-cargo-audit: ${{ needs.changes.outputs.dependencies == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read

  required:
    name: CI / required
    needs: [changes, repository-audit, docs-only, package-check, validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
      DOCS_ONLY_RESULT: ${{ needs.docs-only.result }}
      FULL: ${{ needs.changes.outputs.full }}
      PACKAGE: ${{ needs.changes.outputs.package }}
      PACKAGE_RESULT: ${{ needs.package-check.result }}
      REPOSITORY_RESULT: ${{ needs.repository-audit.result }}
      VALIDATION_RESULT: ${{ needs.validation.result }}
    steps:
      - name: Enforce the routed contract
        run: |
          set -euo pipefail
          [[ "${CHANGES_RESULT}" == "success" ]]
          [[ "${REPOSITORY_RESULT}" == "success" ]]

          if [[ "${DOCS_ONLY}" == "true" ]]; then
            [[ "${DOCS_ONLY_RESULT}" == "success" ]]
          else
            [[ "${DOCS_ONLY_RESULT}" == "skipped" ]]
          fi

          if [[ "${PACKAGE}" == "true" && "${FULL}" != "true" ]]; then
            [[ "${PACKAGE_RESULT}" == "success" ]]
          else
            [[ "${PACKAGE_RESULT}" == "skipped" ]]
          fi

          if [[ "${FULL}" == "true" ]]; then
            [[ "${VALIDATION_RESULT}" == "success" ]]
          else
            [[ "${VALIDATION_RESULT}" == "skipped" ]]
          fi
