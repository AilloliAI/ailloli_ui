name: Public beta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUST_TEST_THREADS: "4"
  CARGO_TERM_COLOR: always

jobs:
  metadata-lockfile:
    name: metadata/lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Validate metadata and lockfile
        run: |
          cargo +1.88.0 metadata --locked --format-version 1 > /dev/null
          python3 .github/scripts/audit-metadata.py
          git diff --exit-code -- Cargo.lock

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88 with rustfmt
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check

  check:
    name: check all targets and features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Check workspace
        run: cargo +1.88.0 check --workspace --all-targets --all-features --locked

  tests:
    name: tests all features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Test workspace
        run: cargo +1.88.0 test --workspace --all-features --lib --bins --tests --locked

  doctests:
    name: doctests all features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Test documentation
        run: cargo +1.88.0 test --workspace --doc --all-features --locked

  clippy:
    name: clippy warnings denied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88 with Clippy
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Run Clippy
        run: cargo +1.88.0 clippy --workspace --all-targets --all-features --locked -- -D warnings

  rustdoc-public:
    name: rustdoc public warnings denied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Build public Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.88.0 doc --workspace --all-features --no-deps --locked

  rustdoc-private:
    name: rustdoc private warnings denied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Build private Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.88.0 doc --workspace --all-features --no-deps --document-private-items --locked

  no-default-features:
    name: façade without default features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Check façade without defaults
        run: cargo +1.88.0 check -p ailloli_ui --no-default-features --locked

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install cargo-audit 0.22.2
        run: cargo +1.88.0 install --locked --version 0.22.2 cargo-audit
      - name: Audit dependency advisories
        run: cargo +1.88.0 audit

  repository-audit:
    name: repository, workflows, links, and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Run fail-closed audit fixtures
        run: |
          python3 .github/scripts/audit-metadata.py --self-test
          python3 .github/scripts/audit-repository.py --self-test
      - name: Audit repository candidate
        run: |
          python3 .github/scripts/audit-metadata.py
          python3 .github/scripts/audit-repository.py --allow-missing-funding
      - name: Audit new commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          zero_sha="0000000000000000000000000000000000000000"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            revision_range="${BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "${EVENT_NAME}" = "push" ] && \
            [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "${zero_sha}" ]; then
            revision_range="${BEFORE_SHA}..${HEAD_SHA}"
          elif git rev-parse "${HEAD_SHA}^" >/dev/null 2>&1; then
            revision_range="${HEAD_SHA}^..${HEAD_SHA}"
          else
            subject="$(git log -1 --format=%s "${HEAD_SHA}")"
            python3 .github/scripts/audit-repository.py \
              --commit-subjects-only --commit-subject="${subject}"
            exit 0
          fi
          python3 .github/scripts/audit-repository.py \
            --commit-subjects-only --commit-range "${revision_range}"
      - name: Validate workflows with pinned actionlint
        run: .github/scripts/run-actionlint.sh
