name: Full validation

on:
  workflow_call:
    inputs:
      working-directory:
        description: Workspace directory relative to the repository root
        required: false
        type: string
        default: "."
      run-cargo-audit:
        description: Run the scheduled or dependency-sensitive RustSec gate
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  rust-gates:
    name: Validation / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: metadata/lockfile
            gate: metadata
            linux: false
          - name: fmt
            gate: fmt
            linux: false
          - name: check all targets and features
            gate: check
            linux: true
          - name: tests all features
            gate: tests
            linux: true
          - name: doctests all features
            gate: doctests
            linux: true
          - name: clippy warnings denied
            gate: clippy
            linux: true
          - name: rustdoc public warnings denied
            gate: rustdoc-public
            linux: true
          - name: rustdoc private warnings denied
            gate: rustdoc-private
            linux: true
          - name: façade without default features
            gate: no-default-features
            linux: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88 components
        env:
          GATE: ${{ matrix.gate }}
        run: |
          case "${GATE}" in
            fmt)
              rustup toolchain install 1.88.0 --profile minimal --component rustfmt
              ;;
            clippy)
              rustup toolchain install 1.88.0 --profile minimal --component clippy
              ;;
            *)
              rustup toolchain install 1.88.0 --profile minimal
              ;;
          esac
      - name: Install Linux build dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libfontconfig1-dev \
            libxkbcommon-dev \
            mesa-vulkan-drivers
      - name: Run ${{ matrix.name }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GATE: ${{ matrix.gate }}
        run: |
          case "${GATE}" in
            metadata)
              cargo +1.88.0 metadata --locked --format-version 1 > /dev/null
              git diff --exit-code -- Cargo.lock
              ;;
            fmt)
              cargo +1.88.0 fmt --all -- --check
              ;;
            check)
              cargo +1.88.0 check --workspace --all-targets --all-features --locked
              ;;
            tests)
              cargo +1.88.0 test --workspace --all-features --lib --bins --tests --locked
              ;;
            doctests)
              cargo +1.88.0 test --workspace --doc --all-features --locked
              ;;
            clippy)
              cargo +1.88.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
              ;;
            rustdoc-public)
              RUSTDOCFLAGS="-D warnings" cargo +1.88.0 doc \
                --workspace --all-features --no-deps --locked
              ;;
            rustdoc-private)
              RUSTDOCFLAGS="-D warnings" cargo +1.88.0 doc \
                --workspace --all-features --no-deps \
                --document-private-items --locked
              ;;
            no-default-features)
              cargo +1.88.0 check -p ailloli_ui --no-default-features --locked
              ;;
            *)
              echo "unknown validation gate: ${GATE}" >&2
              exit 1
              ;;
          esac

  windows-winit:
    name: Validation / Windows winit
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check and test the native Windows host
        working-directory: ${{ inputs.working-directory }}
        run: |
          cargo +1.88.0 check -p ailloli_ui_winit --all-targets --all-features --locked
          cargo +1.88.0 test -p ailloli_ui_winit --all-features --lib --tests --locked

  cargo-audit:
    name: Validation / cargo-audit
    if: inputs.run-cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install cargo-audit 0.22.2
        working-directory: ${{ inputs.working-directory }}
        run: cargo +1.88.0 install --locked --version 0.22.2 cargo-audit
      - name: Audit dependency advisories
        working-directory: ${{ inputs.working-directory }}
        run: cargo +1.88.0 audit

  complete:
    name: Validation / complete
    needs: [rust-gates, windows-winit, cargo-audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AUDIT_REQUESTED: ${{ inputs.run-cargo-audit }}
      AUDIT_RESULT: ${{ needs.cargo-audit.result }}
      RUST_GATES_RESULT: ${{ needs.rust-gates.result }}
      WINDOWS_WINIT_RESULT: ${{ needs.windows-winit.result }}
    steps:
      - name: Enforce complete validation
        run: |
          set -euo pipefail
          [[ "${RUST_GATES_RESULT}" == "success" ]]
          [[ "${WINDOWS_WINIT_RESULT}" == "success" ]]
          if [[ "${AUDIT_REQUESTED}" == "true" ]]; then
            [[ "${AUDIT_RESULT}" == "success" ]]
          else
            [[ "${AUDIT_RESULT}" == "skipped" ]]
          fi
