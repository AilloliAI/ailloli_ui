name: Rustdoc Pages

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "apps/sandbox_app/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Rustdoc site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev libxkbcommon-dev mesa-vulkan-drivers
      - name: Configure Pages metadata
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.88.0 doc --workspace --lib --all-features --no-deps --locked
      - name: Install landing page
        run: |
          cp docs/index.html target/doc/index.html
          touch target/doc/.nojekyll
          if find target/doc -type l -print -quit | grep -q .; then
            echo "Pages artifact must not contain symlinks" >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: target/doc

  deploy:
    name: Deploy Rustdoc site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
