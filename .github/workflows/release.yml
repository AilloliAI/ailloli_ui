name: Release validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validation:
    name: Release / full validation
    uses: ./.github/workflows/validation.yml
    with:
      working-directory: "."
      run-cargo-audit: true
    permissions:
      contents: read

  contract:
    name: Release / package and contract
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Audit repository and workflows
        run: |
          cargo +1.88.0 xtask audit --self-test
          cargo +1.88.0 xtask audit --allow-missing-funding
          .github/scripts/run-actionlint.sh .github/workflows/*.yml
      - name: Inspect all publishable crate archives
        run: cargo +1.88.0 xtask package-check
      - name: Validate the release state
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "push" ]]; then
            [[ "${REF_TYPE}" == "tag" ]]
            cargo +1.88.0 xtask release-check \
              --state tagged \
              --skip-package-check \
              --allow-missing-funding
          else
            [[ "${REF}" == "refs/heads/main" ]]
            cargo +1.88.0 xtask release-check \
              --state release-ready \
              --skip-package-check \
              --allow-missing-funding
          fi
