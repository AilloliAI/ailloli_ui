[package]
name = "ailloli_ui_packaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Host-native desktop packaging tools for Ailloli UI applications"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui_packaging/"
keywords = ["packaging", "desktop", "cargo", "bundle", "rust"]
categories = ["development-tools"]
publish.workspace = true

[lib]
name = "ailloli_ui_packaging"
path = "src/lib.rs"

[[bin]]
name = "cargo-ailloli-ui"
path = "src/main.rs"

[dependencies]
clap.workspace = true
editpe.workspace = true
flate2.workspace = true
image.workspace = true
ailloli_ui_core = { path = "../ailloli_ui_core" }
ailloli_ui_icon = { path = "../ailloli_ui_icon" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
toml.workspace = true
zip.workspace = true
