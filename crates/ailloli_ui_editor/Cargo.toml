[package]
name = "ailloli_ui_editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Backend-neutral multi-paragraph and code editor engine for Ailloli UI"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui_editor/"
keywords = ["editor", "text", "syntax", "selection", "ime"]
categories = ["text-processing"]
readme = "README.md"
publish.workspace = true

[dependencies]
ailloli_ui_core.workspace = true
ailloli_ui_fs.workspace = true
ailloli_ui_text.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tree-sitter = { version = "0.26.9", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-toml = { version = "0.20.0", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-yaml = { version = "0.7.2", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-markdown = { version = "0.7.1", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-swift = { version = "0.7.2", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }

[features]
tree_sitter = ["dep:tree-sitter", "dep:tree-sitter-rust"]
tree_sitter_bash = ["dep:tree-sitter-bash"]
tree_sitter_c = ["dep:tree-sitter-c"]
tree_sitter_css = ["dep:tree-sitter-css"]
tree_sitter_go = ["dep:tree-sitter-go"]
tree_sitter_html = ["dep:tree-sitter-html"]
tree_sitter_java = ["dep:tree-sitter-java"]
tree_sitter_javascript = ["dep:tree-sitter-javascript"]
tree_sitter_json = ["dep:tree-sitter-json"]
tree_sitter_markdown = ["dep:tree-sitter-markdown"]
tree_sitter_php = ["dep:tree-sitter-php"]
tree_sitter_python = ["dep:tree-sitter-python"]
tree_sitter_ruby = ["dep:tree-sitter-ruby"]
tree_sitter_swift = ["dep:tree-sitter-swift"]
tree_sitter_toml = ["dep:tree-sitter-toml"]
tree_sitter_typescript = ["dep:tree-sitter-typescript"]
tree_sitter_yaml = ["dep:tree-sitter-yaml"]
