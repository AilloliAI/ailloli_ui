[package]
name = "ailloli_ui_winit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Native winit windows, input, capture, and WGPU bootstrap for Ailloli UI"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui_winit/"
keywords = ["winit", "gui", "desktop", "window", "wgpu"]
categories = ["gui"]
readme = "README.md"
publish.workspace = true

[features]
default = []
test_support = []
native_overlay = [
    "dep:libc",
    "dep:raw-window-handle",
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
]
devtools = [
    "dep:ailloli_ui_devtools_core",
    "dep:ailloli_ui_devtools_ui",
    "ailloli_ui_runtime/devtools",
]

[dependencies]
winit.workspace = true
ailloli_ui_app_storage.workspace = true
ailloli_ui_core.workspace = true
ailloli_ui_icon.workspace = true
ailloli_ui_runtime.workspace = true
ailloli_ui_text.workspace = true
ailloli_ui_widgets.workspace = true
ailloli_ui_devtools_core = { workspace = true, optional = true }
ailloli_ui_devtools_ui = { workspace = true, optional = true }
ailloli_ui_render_wgpu.workspace = true
ctrlc = { version = "3.4", features = ["termination"] }
ailloli_ui_bench.workspace = true
serde.workspace = true
serde_json.workspace = true
arboard.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
smithay-client-toolkit = { workspace = true, optional = true }
wayland-client = { workspace = true, optional = true, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
ailloli_ui = { path = "../ailloli_ui", features = ["files_local"] }
ailloli_ui_editor = { workspace = true, features = ["tree_sitter"] }
ailloli_ui_widgets = { workspace = true, features = ["files_local"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tokio.workspace = true
