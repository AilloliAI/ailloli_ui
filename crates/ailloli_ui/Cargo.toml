[package]
name = "ailloli_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Retained-mode desktop UI framework façade for Rust"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui/"
keywords = ["ui", "gui", "desktop", "retained-mode", "rust"]
categories = ["gui"]
readme = "README.md"
publish.workspace = true

[features]
default = ["winit"]
winit = ["dep:ailloli_ui_winit", "dep:ailloli_ui_render_wgpu"]
native_overlay = ["winit", "ailloli_ui_winit/native_overlay"]
tree_sitter = ["ailloli_ui_widgets/tree_sitter"]
files = ["ailloli_ui_widgets/files"]
files_local = ["files", "ailloli_ui_widgets/files_local"]
terminal_pty = ["dep:ailloli_ui_terminal_pty"]
terminal_pty_portable = ["terminal_pty", "ailloli_ui_terminal_pty/portable"]
devtools = [
    "dep:ailloli_ui_devtools_core",
    "dep:ailloli_ui_devtools_ui",
    "ailloli_ui_runtime/devtools",
    "ailloli_ui_winit?/devtools",
]
devtools_terminal = [
    "devtools",
    "ailloli_ui_devtools_core/terminal",
    "ailloli_ui_devtools_ui/terminal",
]

[dependencies]
ailloli_ui_app_storage.workspace = true
ailloli_ui_core.workspace = true
ailloli_ui_fs.workspace = true
ailloli_ui_runtime.workspace = true
ailloli_ui_terminal_core.workspace = true
ailloli_ui_terminal_pty = { workspace = true, optional = true }
ailloli_ui_text.workspace = true
ailloli_ui_widgets.workspace = true
ailloli_ui_icon.workspace = true
ailloli_ui_devtools_core = { workspace = true, optional = true }
ailloli_ui_devtools_ui = { workspace = true, optional = true }
ailloli_ui_winit = { workspace = true, optional = true }
ailloli_ui_render_wgpu = { workspace = true, optional = true }
serde_json.workspace = true
