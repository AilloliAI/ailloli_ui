[package]
name = "ailloli_ui_devtools_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Backend-neutral inspection snapshots and diagnostics for Ailloli UI"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui_devtools_core/"
keywords = ["devtools", "inspection", "diagnostics", "gui", "rust"]
categories = ["development-tools"]
publish.workspace = true

[features]
default = []
terminal = ["dep:ailloli_ui_terminal_core"]

[dependencies]
ailloli_ui_core = { path = "../ailloli_ui_core" }
ailloli_ui_runtime = { path = "../ailloli_ui_runtime", features = ["devtools"] }
ailloli_ui_terminal_core = { path = "../ailloli_ui_terminal_core", optional = true }
serde.workspace = true
serde_json.workspace = true
