[package]
name = "ailloli_ui_devtools_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Backend-neutral inspection snapshots and diagnostics for Ailloli UI"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui_devtools_core/"
keywords = ["devtools", "inspection", "diagnostics", "gui", "rust"]
categories = ["development-tools"]
readme = "README.md"
publish.workspace = true

[features]
default = []
terminal = ["dep:ailloli_ui_terminal_core"]

[dependencies]
ailloli_ui_core.workspace = true
ailloli_ui_runtime = { workspace = true, features = ["devtools"] }
ailloli_ui_terminal_core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
