[package]
name = "ailloli_ui_devtools_ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Retained inspection panels and overlays for Ailloli UI DevTools"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui_devtools_ui/"
keywords = ["devtools", "inspection", "overlay", "gui", "rust"]
categories = ["development-tools"]
publish.workspace = true

[features]
default = []
terminal = ["ailloli_ui_devtools_core/terminal"]

[dependencies]
ailloli_ui_core = { path = "../ailloli_ui_core" }
ailloli_ui_devtools_core = { path = "../ailloli_ui_devtools_core" }
ailloli_ui_runtime = { path = "../ailloli_ui_runtime" }
ailloli_ui_widgets = { path = "../ailloli_ui_widgets" }

[dev-dependencies]
ailloli_ui_text = { path = "../ailloli_ui_text" }
