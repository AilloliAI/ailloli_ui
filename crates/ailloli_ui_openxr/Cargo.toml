[package]
name = "ailloli_ui_openxr"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["wgpu-target"]
wgpu-target = ["dep:wgpu", "dep:ailloli_ui_render"]
openxr = ["dep:openxr", "dep:ash", "dep:ailloli_ui_text", "dep:ailloli_ui_render_vulkan"]
smoke-ui = ["openxr", "dep:ailloli_ui_widgets"]

[dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded"], optional = true }
openxr = { version = "0.21", features = ["loaded"], optional = true }
log = "0.4"
thiserror.workspace = true
wgpu = { workspace = true, optional = true }

ailloli_ui_core = { path = "../ailloli_ui_core" }
ailloli_ui_render = { path = "../ailloli_ui_render_wgpu", package = "ailloli_ui_render_wgpu", optional = true }
ailloli_ui_runtime = { path = "../ailloli_ui_runtime" }
ailloli_ui_text = { path = "../ailloli_ui_text", optional = true }
ailloli_ui_widgets = { path = "../ailloli_ui_widgets", optional = true }
ailloli_ui_render_vulkan = { path = "../ailloli_ui_render_vulkan", optional = true }

[dev-dependencies]
ailloli_ui_widgets = { path = "../ailloli_ui_widgets" }
