[package]
name = "ailloli_ui_widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Generic retained widget catalogue for Ailloli UI"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui_widgets/"
keywords = ["gui", "widgets", "controls", "layout", "desktop"]
categories = ["gui"]
readme = "README.md"
publish.workspace = true

[features]
tree_sitter = ["ailloli_ui_editor/tree_sitter"]
files = ["dep:devicons", "dep:ailloli_ui_devicons_font", "dep:ailloli_ui_fs"]
files_local = ["files", "dep:ailloli_ui_fs_local", "dep:ailloli_ui_fs_runtime"]

[dependencies]
ailloli_ui_core.workspace = true
ailloli_ui_editor.workspace = true
ailloli_ui_fs = { workspace = true, optional = true }
ailloli_ui_fs_local = { workspace = true, optional = true }
ailloli_ui_fs_runtime = { workspace = true, optional = true }
ailloli_ui_runtime.workspace = true
ailloli_ui_terminal_core.workspace = true
ailloli_ui_text.workspace = true
devicons = { workspace = true, optional = true }
ailloli_ui_devicons_font = { workspace = true, optional = true }
lucide-icons.workspace = true
tracing = "0.1"
thiserror.workspace = true
