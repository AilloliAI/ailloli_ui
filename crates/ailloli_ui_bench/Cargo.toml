[package]
name = "ailloli_ui_bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Versioned performance recording and regression gates for Ailloli UI"
documentation = "https://ailloliai.github.io/ailloli_ui/ailloli_ui_bench/"
keywords = ["benchmark", "performance", "jsonl", "gui", "rust"]
categories = ["development-tools"]
publish.workspace = true

[features]
default = []
cli = ["dep:clap"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
once_cell.workspace = true
thiserror.workspace = true
sha2.workspace = true
clap = { workspace = true, optional = true }

[[bin]]
name = "ailloli-ui-bench"
path = "src/bin/ailloli_ui_bench.rs"
required-features = ["cli"]
